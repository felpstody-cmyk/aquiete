<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('consent', 'default', {
    ad_storage: 'granted', ad_user_data: 'granted',
    ad_personalization: 'granted', analytics_storage: 'granted'
  });
  gtag('config', 'AW-17670361503');
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-17670361503"></script>
</head>
<body style="font:16px system-ui;padding:2rem">
<p id="estado">Carregando a tag...</p>
<script>
(function(){
  var alvo = document.getElementById('estado');
  if (new URLSearchParams(location.search).get('disparar') !== '1') {
    alvo.textContent = 'Nada disparado. Use ?disparar=1 para enviar a conversao de teste.';
    return;
  }
  gtag('event', 'conversion', {
    send_to: 'AW-17670361503/n1OQCOXx-IodEJ-j8elB',
    value: 0,
    currency: 'BRL',
    transaction_id: 'TESTE-TAG-' + Date.now()
  });

  document.title = 'DISPARADO';
})();
</script>
