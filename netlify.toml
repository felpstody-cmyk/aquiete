# ============================================================
#  Aquiete — configuração do Netlify
# ============================================================

[build]
  publish = "."
  functions = "netlify/functions"

# O codigo das funcoes NAO pode ser lido pela web.
# Com publish = ".", a pasta netlify/ tambem virava conteudo estatico:
# qualquer um baixava catalogo.mjs e via a tabela de precos e os cupons.
# Precisa vir antes das outras regras, e com force.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# URL limpa: /termos em vez de /termos.html
[[redirects]]
  from = "/termos"
  to = "/termos.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

# Página de venda única pra onde todos os advertoriais apontam
[[redirects]]
  from = "/oferta"
  to = "/oferta.html"
  status = 200

# Advertorial: artigo que informa primeiro e so entao leva pra oferta.
# Fica fora do bloqueio-geo de proposito enquanto esta em revisao, pra
# dar pra abrir daqui de Chapeco.
[[redirects]]
  from = "/motivos"
  to = "/motivos.html"
  status = 200

# Advertorial so de anuncio. Quem decide quem entra e a edge function
# so-anuncio.mjs: sem a chave no link, devolve 404.
[[redirects]]
  from = "/psiquiatra"
  to = "/psiquiatra.html"
  status = 200

# ------------------------------------------------------------
#  VARIÁVEIS DE AMBIENTE
#  Configure em: Site configuration > Environment variables.
#  NUNCA coloque chave de API neste arquivo — ele vai para o
#  repositório e para o pacote publicado.
#
#    GATEWAY          asaas | pagarme | mercadopago
#    ASAAS_API_KEY    chave do Asaas (começa com $aact_)
#    ASAAS_AMBIENTE   producao (padrão se não existir) | sandbox
# ------------------------------------------------------------
#  DESPACHO NO MELHOR ENVIO
#
#  Sem o bloco REMETENTE_* abaixo o despacho fica desligado e cada
#  venda volta a ser cadastrada na mão. Não é opcional por capricho:
#  a API exige o endereço completo de quem posta, e CEP_ORIGEM
#  sozinho só serve pra cotar.
#
#    MELHORENVIO_TOKEN      Integrações > Tokens, no painel deles.
#                           Precisa das permissões de carrinho; e
#                           também de compra, geração e impressão se
#                           MELHORENVIO_DESPACHO for "completo".
#    MELHORENVIO_AMBIENTE   producao (padrão) | sandbox
#    MELHORENVIO_DESPACHO   carrinho (padrão) deixa o envio pronto no
#                           carrinho pra ele conferir e comprar.
#                           completo paga a etiqueta com o saldo da
#                           carteira e devolve o link pra imprimir.
#                           off desliga.
#    MELHORENVIO_SEGURAR    1 declara o valor do produto como valor
#                           segurado. Só se a DC-e vier recusada por
#                           divergência — o frete sobe um pouco.
#
#    CEP_ORIGEM             de onde sai a encomenda
#    REMETENTE_NOME         razão social do MEI
#    REMETENTE_CNPJ         só os dígitos
#    REMETENTE_RUA
#    REMETENTE_NUMERO
#    REMETENTE_COMPLEMENTO  (opcional)
#    REMETENTE_BAIRRO
#    REMETENTE_CIDADE
#    REMETENTE_UF
#    REMETENTE_TELEFONE     (opcional)
#    REMETENTE_EMAIL        (opcional, cai em contato@aquieteagora.com.br)
#    REMETENTE_IE           (opcional, cai em ISENTO — MEI é isento)
#    REMETENTE_CNAE         (opcional, só a LATAM Cargo exige)
# ------------------------------------------------------------
